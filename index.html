<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Pré-Orçamento Técnico | Legião Técnica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl">
    
    <!-- Cabeçalho -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-amber-500/10 text-amber-400 mb-3 border border-amber-500/20">
        <i class="fa-solid fa-bolt text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Legião Técnica</h1>
      <p class="text-sm text-slate-400 mt-1">Simulador de Pré-Orçamento e Diagnóstico Rápido</p>
    </div>

    <!-- Formulário -->
    <form id="orcamentoForm" class="space-y-4">
      
      <!-- Categoria do Equipamento -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Equipamento / Serviço
        </label>
        <select id="categoria" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-amber-500 transition">
          <option value="nobreak" data-min="120" data-max="380">Nobreak / Estabilizador de Tensão</option>
          <option value="placa" data-min="150" data-max="450">Placa Eletrônica / Placa-Mãe</option>
          <option value="inversor" data-min="250" data-max="750">Inversor Solar / Inversor de Frequência</option>
          <option value="rede" data-min="180" data-max="500">Infraestrutura de Rede / CFTV</option>
          <option value="manutencao_ti" data-min="90" data-max="220">Manutenção / Otimização de Computador</option>
          <option value="eletrica" data-min="150" data-max="600">Instalação / Reparo em Quadro Elétrico</option>
        </select>
      </div>

      <!-- Marca e Modelo -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Marca e Modelo aproximado
        </label>
        <input type="text" id="modelo" placeholder="Ex: SMS Mirage 3kVA ou Dell Optiplex" required
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-amber-500 transition">
      </div>

      <!-- Sintoma / Defeito -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Sintoma Apresentado
        </label>
        <textarea id="sintoma" rows="3" placeholder="Ex: Não liga após raio, cheiro de queimado ou desarma o disjuntor" required
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-amber-500 transition"></textarea>
      </div>

      <!-- Urgência -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Prioridade de Atendimento
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2 p-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-slate-500">
            <input type="radio" name="prioridade" value="Normal" checked class="text-amber-500 focus:ring-0">
            <span class="text-sm text-slate-300">Padrão (Oficina)</span>
          </label>
          <label class="flex items-center gap-2 p-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-slate-500">
            <input type="radio" name="prioridade" value="Emergencial" class="text-amber-500 focus:ring-0">
            <span class="text-sm text-amber-400 font-medium">Urgência / Parada</span>
          </label>
        </div>
      </div>

      <!-- Opção de Anexar Fotos/Vídeo -->
      <div class="p-4 bg-slate-900/90 border border-slate-700 rounded-xl">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="temFoto" class="w-4 h-4 text-amber-500 rounded focus:ring-0 cursor-pointer">
          <span class="text-sm font-medium text-slate-200">Possuo foto ou vídeo da placa / etiqueta do defeito</span>
        </label>
        <p class="text-[12px] text-slate-400 mt-2 ml-7">
          <i class="fa-solid fa-paperclip text-amber-400 mr-1"></i> Ao abrir o WhatsApp, anexe o arquivo diretamente no ícone de clipe antes de enviar.
        </p>
      </div>

      <!-- Painel de Estimativa -->
      <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-4 mt-6">
        <div class="flex justify-between items-center text-xs text-slate-400 mb-1">
          <span>Estimativa Base Preliminar:</span>
          <span class="text-slate-500">*Sujeito à bancada técnica</span>
        </div>
        <div class="text-2xl font-bold text-amber-400" id="faixaPreco">
          R$ 120,00 - R$ 380,00
        </div>
      </div>

      <!-- Botão de Ação -->
      <button type="button" onclick="enviarWhatsApp()" 
        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center gap-3 transition shadow-lg shadow-emerald-900/30">
        <i class="fa-brands fa-whatsapp text-xl"></i>
        <span>Solicitar Avaliação via WhatsApp</span>
      </button>

    </form>

    <p class="text-[11px] text-center text-slate-500 mt-4">
      Legião Técnica • Atendimento Especializado • www.legiaotecnica.com.br
    </p>
  </div>

  <script>
    const categoriaSelect = document.getElementById('categoria');
    const faixaPrecoEl = document.getElementById('faixaPreco');

    function atualizarEstimativa() {
      const selected = categoriaSelect.options[categoriaSelect.selectedIndex];
      const min = selected.getAttribute('data-min');
      const max = selected.getAttribute('data-max');
      faixaPrecoEl.textContent = `R$ ${min},00 - R$ ${max},00`;
    }

    categoriaSelect.addEventListener('change', atualizarEstimativa);

    function enviarWhatsApp() {
      const modelo = document.getElementById('modelo').value.trim();
      const sintoma = document.getElementById('sintoma').value.trim();
      const categoriaTexto = categoriaSelect.options[categoriaSelect.selectedIndex].text;
      const faixa = faixaPrecoEl.textContent;
      const prioridade = document.querySelector('input[name="prioridade"]:checked').value;
      const temFoto = document.getElementById('temFoto').checked;

      if (!modelo || !sintoma) {
        alert('Por favor, informe a marca/modelo e o defeito do equipamento.');
        return;
      }

      // Configure o número real da Legião Técnica (55 + DDD + Número)
      const numeroWhatsApp = "5514998602147"; 

      let linhaFoto = "";
      if (temFoto) {
        linhaFoto = `📎 *Anexo:* Vou enviar a foto/vídeo da placa/etiqueta a seguir.\n`;
      }

      const mensagem = `*SOLICITAÇÃO DE PRÉ-ORÇAMENTO - LEGIÃO TÉCNICA*\n\n` +
        `🔧 *Equipamento:* ${categoriaTexto}\n` +
        `🏷️ *Modelo/Marca:* ${modelo}\n` +
        `⚠️ *Defeito Relatado:* ${sintoma}\n` +
        `⏱️ *Prioridade:* ${prioridade}\n` +
        linhaFoto +
        `📊 *Faixa Estimada:* ${faixa}\n\n` +
        `Gostaria de agendar o envio/avaliação na bancada.`;

      const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
